# kindle-dashboard.conf -- upstart job that auto-starts the dashboard
# daemon at boot.
#
# DO NOT copy this into /etc/upstart/ until you have:
#   1. Run bin/run.sh manually over SSH and confirmed it works
#      (see kindle-daemon/INSTALL.md, step 5).
#   2. Read INSTALL.md's warning about verifying the "start on" event
#      name below actually matches a job that exists on YOUR firmware.
#
# Background on the "start on" line: Kindle's init system is upstart
# (same family as old Ubuntu). Community convention for "run my thing
# once the native Kindle UI has finished coming up" is to start on the
# event fired when the job that draws Amazon's own home-screen UI
# ("lab126_gui" on many firmware builds) has started. This file is
# ADDITIVE ONLY -- it does not edit or replace any stock Amazon upstart
# job, so the safe-rollback story is just "delete this one file" (see
# INSTALL.md's rollback section). Getting the event name wrong just means
# this job silently never starts (a no-op, not a boot failure) -- but a
# malformed .conf file in /etc/upstart/ CAN, per long-standing community
# reports, prevent the device from booting at all. That's exactly why
# INSTALL.md makes you test bin/run.sh by hand first, and why this file
# keeps its actual logic to one line that either runs a script that
# already works, or is trivially absent.
#
# IMPORTANT: this file must use Unix (LF) line endings. If you edit it on
# Windows and it picks up CRLF endings, upstart can fail to parse it in
# ways that are hard to diagnose. Copying it via `cp` on the Kindle
# itself (as INSTALL.md tells you to) avoids this entirely -- just don't
# hand-retype it in Notepad.

description "Kindle Dashboard daemon"

start on started lab126_gui
stop on stopping lab126_gui

respawn
respawn limit 5 60

script
    RUN_SCRIPT="/mnt/us/kindle-daemon/bin/run.sh"
    if [ -x "$RUN_SCRIPT" ]; then
        exec sh "$RUN_SCRIPT"
    fi
    # If run.sh isn't there or isn't executable, do nothing rather than
    # error out -- this job should never be the reason the device fails
    # to finish booting.
end script
