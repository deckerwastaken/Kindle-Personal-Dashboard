# kindle-lockscreen.conf -- EXPERIMENTAL, Tier 2 only.
#
# Read lockscreen/README.md and lockscreen/INSTALL.md before using this
# file. Short version: Tier 1 (configuring KOReader's own built-in
# Screensaver feature to show a custom message) is the recommended,
# low-risk, community-documented way to get a custom screensaver on this
# specific device class -- current research (kindlemodding.org's own
# jailbreak FAQ, checked twice while building this) states plainly that
# there is no maintained, ready-made system-level screensaver-replacement
# extension for hard-float Kindle firmware (which is what 5.12.2.2 is),
# and recommends KOReader's built-in feature instead. Tier 1 covers you
# whenever KOReader itself is the thing that suspends.
#
# This file is for the gap case: the device auto-sleeping from the
# native Kindle Home screen (or from the kindle-daemon dashboard) rather
# than from inside KOReader, where Amazon's own screensaver rotation is
# what's normally shown. Getting that system-wide requires hooking
# whatever upstart event actually fires when the device is about to
# sleep -- and unlike kindle-daemon's boot-time hook (which had a
# well-corroborated community convention to use), NO single upstart event
# name for "about to suspend" was confirmed to be reliable across
# firmware versions during research for this project.
#
# ============================================================
# YOU MUST FILL IN THE "start on" LINE YOURSELF -- see below.
# ============================================================
#
# How to find the right event, over SSH/Telnet on the device:
#   ls /etc/upstart/
#   grep -il "screensaver\|powerd\|suspend" /etc/upstart/*.conf
#   cat /etc/upstart/<whatever that found>.conf
# Look for a job whose "start on"/"stop on" lines reference the point
# right before the screen goes to sleep (often something with "powerd"
# or "screensaver" in the job or event name -- naming varies by firmware
# build, which is exactly why this can't be hardcoded responsibly here).
# Replace the placeholder line below with what you find, matching its
# style (e.g. `start on <event-name>`).
#
# If you can't find a confident candidate: skip this file entirely and
# rely on Tier 1 only. A cosmetic gap (native Home-screen sleeps still
# show Amazon's stock image) is a far better outcome than guessing at a
# boot/suspend hook you can't verify.

description "Experimental custom lock screen hook -- verify start-on event before use, see comments above"

start on REPLACE_WITH_YOUR_DEVICES_SUSPEND_EVENT

script
    SCRIPT="/mnt/us/lockscreen/src/draw_lockscreen.sh"
    if [ -x "$SCRIPT" ] || [ -f "$SCRIPT" ]; then
        sh "$SCRIPT" || true
    fi
    # Never let this job exit non-zero / hang -- see draw_lockscreen.sh's
    # own comment about degrading quietly for anything wired into boot.
end script
